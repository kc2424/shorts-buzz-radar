name = "buzz-style-poll"
main = "workers/poll/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "buzz-style"
database_id = "91e4f13a-6caf-4d96-b31e-4faf9ff13caf"
migrations_dir = "migrations"

[triggers]
crons = ["0 * * * *"]

[vars]
# Set secrets via: wrangler secret put YOUTUBE_API_KEY
# wrangler secret put GEMINI_API_KEY
# wrangler secret put CRON_SECRET
